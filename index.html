<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeViewFX Static Publish</title>
<style>
  :root {
    --bg: #05070b;
    --card: rgba(255,255,255,0.055);
    --line: rgba(255,255,255,0.13);
    --text: #f6f7fb;
    --muted: rgba(246,247,251,0.68);
    --gold: #f2c14e;
    --blue: #79a9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 18px;
  }
  .hero {
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 24px;
    background: linear-gradient(135deg, rgba(242,193,78,0.14), rgba(121,169,255,0.08));
  }
  .eyebrow {
    color: var(--gold);
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 800;
    font-size: 12px;
    margin-bottom: 10px;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 4vw, 48px);
    line-height: 1;
  }
  .sub {
    color: var(--muted);
    line-height: 1.55;
    max-width: 760px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 12px;
    margin: 18px 0;
  }
  .card {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    padding: 15px;
  }
  .label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .value {
    font-size: 18px;
    font-weight: 800;
  }
  a {
    color: var(--text);
    text-decoration: none;
  }
  .warning {
    color: var(--muted);
    margin-top: 18px;
    font-size: 12px;
    line-height: 1.5;
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="eyebrow">PrimeViewFX</div>
    <h1>New research is in progress</h1>
    <p class="sub">PrimeViewFX is being rebuilt around a validated research framework - the refreshed site is coming soon.</p>
  </section>

  <p class="warning">Research only. Not a trading signal.</p>
</main>
</body>
</html>
